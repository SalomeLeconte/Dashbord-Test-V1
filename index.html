<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard WIP — Version expérimentale</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
    #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
  #logout-btn{position:fixed;top:12px;right:12px;z-index:99999;border:1px solid #dbe2e8;border-radius:10px;background:#fff;color:#475569;padding:8px 12px;font:700 12px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 14px #0002}#logout-btn:hover{border-color:#005a9c;color:#005a9c}
  </style>
</head>
<body><a id="admin-users-btn" href="/admin-users" style="position:fixed;top:12px;right:112px;z-index:99999;border:1px solid #dbe2e8;border-radius:10px;background:#fff;color:#475569;padding:8px 12px;font:700 12px Arial,sans-serif;text-decoration:none;box-shadow:0 4px 14px #0002">Utilisateurs</a><button id="logout-btn" type="button">Déconnexion</button>
  <iframe id="app-frame" title="Dashboard WIP" src="about:blank"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('app-frame');
      const logout = document.getElementById('logout-btn');
      if (logout) logout.addEventListener('click', async () => {
        logout.disabled = true;
        try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } finally { location.replace('/login'); }
      });
      if (!frame) return;

      const loadLatestDashboard = () => {
        const url = new URL('./dashboard-wip.html', window.location.href);
        url.searchParams.set('deploy', String(Date.now()));
        frame.src = url.href;
      };

      loadLatestDashboard();
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) loadLatestDashboard();
      });
    })();
  </script>
</body>
</html>
