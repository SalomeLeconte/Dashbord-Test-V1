<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard WIP — Version expérimentale</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #wip-corner-ribbon{position:fixed;z-index:20000;top:30px;right:-82px;width:310px;transform:rotate(45deg);pointer-events:none;padding:8px 0;text-align:center;background:linear-gradient(135deg,#facc15,#eab308);color:#111827;border-top:1px solid rgba(17,24,39,.28);border-bottom:1px solid rgba(17,24,39,.28);box-shadow:0 12px 28px rgba(2,6,23,.24);font-size:11px;font-weight:1000;letter-spacing:.075em;text-transform:uppercase;line-height:1.15}
    @media(max-width:767px){#wip-corner-ribbon{display:none!important}}
  </style>
</head>
<body>
  <iframe id="app-frame" title="Dashboard WIP"></iframe>
  <div id="wip-corner-ribbon" aria-label="Mise à jour data et contenu">MAJ data + contenu 7 Août 15:00</div>
  <script>
    (()=>{
      const frame=document.getElementById('app-frame');

      async function bootDashboard(){
        try{
          const response=await fetch('./dashboard-wip.html',{cache:'no-store'});
          if(!response.ok)throw new Error(`HTTP ${response.status}`);
          let html=await response.text();
          const baseHref=new URL('./',window.location.href).href;
          html=html.replace('<head>',`<head>\n<base href="${baseHref}">`);
          html=html.replace('</body>','<script src="./wip-performance-patch.js"><\/script>\n<script src="./wip-followup-patch.js"><\/script>\n<script src="./wip-release-refine-patch.js"><\/script>\n<script src="./wip-marker-novelty-green-patch.js"><\/script>\n<script src="./wip-feedback-patch.js"><\/script>\n<script src="./wip-stability-repair-patch.js"><\/script>\n<script src="./wip-route-ui-refine-patch.js"><\/script>\n<script src="./wip-responsive-device-patch.js"><\/script>\n<script src="./wip-map-terrain-search-patch.js"><\/script>\n<script src="./wip-smart-route-sync-patch.js"><\/script>\n<script src="./wip-route-sector-final-fix-patch.js"><\/script>\n<script src="./wip-route-status-compact-patch.js"><\/script>\n<script src="./wip-table-excel-filters-date-sort-patch.js"><\/script>\n<script src="./wip-undercarriage-filter-patch.js"><\/script>\n<script src="./wip-canton-adaptive-filter-patch.js"><\/script>\n<script src="./wip-filter-placeholder-cleanup-patch.js"><\/script>\n</body>');
          frame.srcdoc=html;
        }catch(error){
          console.error('Chargement du dashboard WIP impossible.',error);
          frame.src='./dashboard-wip.html';
        }
      }

      bootDashboard();
    })();
  </script>
</body>
</html>
