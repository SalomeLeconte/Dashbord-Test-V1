<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard WIP — Version expérimentale</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #wip-corner-ribbon{position:fixed;z-index:20000;top:18px;right:18px;pointer-events:none;max-width:285px;padding:10px 16px 10px 18px;text-align:left;background:linear-gradient(135deg,#fff7cc 0%,#facc15 58%,#eab308 100%);color:#111827;border:1px solid rgba(17,24,39,.18);border-radius:0 18px 0 16px;box-shadow:0 14px 30px rgba(2,6,23,.24);font-size:12px;font-weight:1000;letter-spacing:.055em;text-transform:uppercase;line-height:1.25;opacity:1;visibility:visible;transform:translateY(0);transition:opacity .2s ease,visibility .2s ease,transform .2s ease}
    #wip-corner-ribbon.is-hidden{opacity:0;visibility:hidden;transform:translateY(-8px)}
    #wip-corner-ribbon::before{content:"";position:absolute;top:100%;right:-1px;width:0;height:0;border-top:14px solid #b45309;border-left:14px solid transparent;filter:drop-shadow(-2px 3px 2px rgba(2,6,23,.14))}
    #wip-corner-ribbon::after{content:"";position:absolute;top:-1px;right:-1px;width:18px;height:18px;background:#111827;clip-path:polygon(100% 0,0 0,100% 100%);opacity:.16;border-radius:0 16px 0 0}
    @media(max-width:1023px){#wip-corner-ribbon{display:none!important}}
  </style>
</head>
<body>
  <iframe id="app-frame" title="Dashboard WIP"></iframe>
  <div id="wip-corner-ribbon" class="is-hidden" aria-label="Mise à jour data et contenu">MAJ data + contenu 7 Août 15:00</div>
  <script>
    (()=>{
      const frame=document.getElementById('app-frame');
      const ribbon=document.getElementById('wip-corner-ribbon');
      const ribbonStartedAt=Date.now();
      const MAX_RIBBON_MS=30000;
      let frameReady=false;
      let ribbonTimer=null;
      const patches=[
        'wip-performance-patch.js',
        'wip-followup-patch.js',
        'wip-release-refine-patch.js',
        'wip-marker-novelty-green-patch.js',
        'wip-feedback-patch.js',
        'wip-stability-repair-patch.js',
        'wip-route-ui-refine-patch.js',
        'wip-responsive-device-patch.js',
        'wip-map-terrain-search-patch.js',
        'wip-smart-route-sync-patch.js',
        'wip-route-sector-final-fix-patch.js',
        'wip-route-status-compact-patch.js',
        'wip-table-excel-filters-date-sort-patch.js',
        'wip-undercarriage-filter-patch.js',
        'wip-canton-adaptive-filter-patch.js',
        'wip-filter-placeholder-cleanup-patch.js',
        'wip-siret-dedupe-patch.js',
        'wip-undercarriage-detail-ui-patch.js',
        'wip-release-target-precision-patch.js',
        'wip-undercarriage-modal-clean-patch.js',
        'wip-canton-note-cleanup-patch.js',
        'wip-undercarriage-model-rules-patch.js',
        'wip-undercarriage-smr-filter-patch.js',
        'wip-undercarriage-badge-restore-patch.js',
        'wip-undercarriage-native-visual-final-patch.js',
        'wip-stack-guard-patch.js'
      ];

      function isDesktop(){return window.matchMedia('(min-width:1024px)').matches;}
      function ribbonTimeAllowed(){return Date.now()-ribbonStartedAt<=MAX_RIBBON_MS;}
      function isPortfolioSelectionVisible(){
        if(!isDesktop()||!frameReady||!ribbonTimeAllowed())return false;
        try{
          const doc=frame.contentDocument;
          const win=frame.contentWindow;
          const overlay=doc?.getElementById('nominative-overlay');
          if(!overlay)return false;
          const style=win.getComputedStyle(overlay);
          return style.display!=='none'&&style.visibility!=='hidden'&&style.opacity!=='0'&&overlay.getBoundingClientRect().height>0;
        }catch(error){return false;}
      }
      function syncRibbon(){
        const show=isPortfolioSelectionVisible();
        ribbon?.classList.toggle('is-hidden',!show);
        if(!show&&Date.now()-ribbonStartedAt>MAX_RIBBON_MS){clearInterval(ribbonTimer);ribbonTimer=null;}
      }
      frame.addEventListener('load',()=>{
        frameReady=true;
        syncRibbon();
        clearInterval(ribbonTimer);
        ribbonTimer=setInterval(syncRibbon,300);
        window.setTimeout(syncRibbon,MAX_RIBBON_MS+100);
      });
      window.addEventListener('resize',syncRibbon);
      async function bootDashboard(){
        try{
          const response=await fetch('./dashboard-wip.html',{cache:'no-store'});
          if(!response.ok)throw new Error(`HTTP ${response.status}`);
          let html=await response.text();
          const baseHref=new URL('./',window.location.href).href;
          const injected=patches.map((file)=>`<script src="./${file}"><\/script>`).join('\n');
          html=html.replace('<head>',`<head>\n<base href="${baseHref}">`);
          html=html.replace('</body>',`${injected}\n</body>`);
          frame.srcdoc=html;
        }catch(error){
          console.error('Chargement du dashboard WIP impossible.',error);
          frame.src='./dashboard-wip.html';
        }
      }
      ribbonTimer=setInterval(syncRibbon,300);
      bootDashboard();
    })();
  </script>
</body>
</html>
