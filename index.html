<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard WIP — Version expérimentale</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
  </style>
</head>
<body>
  <iframe id="app-frame" title="Dashboard WIP"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('app-frame');

      async function bootDashboard(){
        try{
          const response=await fetch('./dashboard-wip.html',{cache:'no-store'});
          if(!response.ok)throw new Error(`HTTP ${response.status}`);
          let html=await response.text();
          const baseHref=new URL('./',window.location.href).href;
          html=html.replace('<head>',`<head>\n<base href="${baseHref}">`);
          html=html.replace('</body>','<script src="./wip-performance-patch.js"><\/script>\n<script src="./wip-followup-patch.js"><\/script>\n<script src="./wip-release-refine-patch.js"><\/script>\n<script src="./wip-marker-novelty-green-patch.js"><\/script>\n<script src="./wip-feedback-patch.js"><\/script>\n<script src="./wip-stability-repair-patch.js"><\/script>\n<script src="./wip-route-ui-refine-patch.js"><\/script>\n<script src="./wip-responsive-device-patch.js"><\/script>\n<script src="./wip-map-terrain-search-patch.js"><\/script>\n<script src="./wip-smart-route-sync-patch.js"><\/script>\n<script src="./wip-route-sector-final-fix-patch.js"><\/script>\n<script src="./wip-route-status-compact-patch.js"><\/script>\n</body>');
          frame.srcdoc=html;
        }catch(error){
          console.error('Chargement du dashboard WIP impossible.',error);
          frame.src='./dashboard-wip.html';
        }
      }

      bootDashboard();
    })();
  </script>
</body>
</html>
