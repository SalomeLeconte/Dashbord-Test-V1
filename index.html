<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Dashboard WIP — Version expérimentale</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
    #app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
  </style>
</head>
<body>
  <iframe id="app-frame" title="Dashboard WIP" src="about:blank"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('app-frame');
      if (!frame) return;

      const loadLatestDashboard = () => {
        const url = new URL('./dashboard-wip.html', window.location.href);
        url.searchParams.set('deploy', String(Date.now()));
        frame.src = url.href;
      };

      loadLatestDashboard();
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) loadLatestDashboard();
      });
    })();
  </script>
</body>
</html>
