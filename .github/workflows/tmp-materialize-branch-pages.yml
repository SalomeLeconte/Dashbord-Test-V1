name: Temporary materialize branch Pages source

on:
  push:
    branches:
      - fix/wip-materialize-branch-pages-source-20260907

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/wip-materialize-branch-pages-source-20260907

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Permanently prune legacy dashboard source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate current WIP runtime bundle
        run: npm run bundle

      - name: Validate branch-served source
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-runtime.bundle.js
          grep -q 'wip-city-filter-input-crash-fix-2026-09-07-v4' wip-runtime.bundle.js
          ! grep -q 'wip-canton-adaptive-filter' wip-runtime.bundle.js
          ! grep -q '__WIP_CANTON_ADAPTIVE_FILTER_PATCH__' wip-runtime.bundle.js
          ! grep -q 'f-canton-select' dashboard-wip.html
          ! grep -q 'acc-undercarriage' dashboard-wip.html
          ! grep -q 'patchCantonInProgress' dashboard-wip.html
          ! grep -q 'Menu déroulant canton en cours de développement' dashboard-wip.html
          grep -q 'wip-runtime.bundle.js?v=20260907-branch-pages-v1' dashboard-wip.html

      - name: Commit materialized source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Branch Pages source already materialized.'
            exit 0
          fi
          git commit -m 'Materialize current WIP for branch Pages hosting'
          git push origin HEAD:fix/wip-materialize-branch-pages-source-20260907
