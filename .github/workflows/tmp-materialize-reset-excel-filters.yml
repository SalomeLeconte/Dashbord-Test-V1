name: Temporary materialize Excel reset fix

on:
  push:
    branches: [fix/wip-reset-excel-filters]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/wip-reset-excel-filters

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize branch Pages source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate runtime bundle
        run: npm run bundle

      - name: Validate Excel reset integration
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-reset-excel-filters-patch.js
          node --check wip-runtime.bundle.js
          grep -q 'wip-reset-excel-filters-2026-09-11-v1' wip-runtime.bundle.js
          grep -q '__wipResetExcelColumnFilters' wip-runtime.bundle.js
          grep -q 'button\[onclick\*="resetAllFilters"\]' wip-runtime.bundle.js
          grep -q 'clientText: .\{0,2\}' wip-reset-excel-filters-patch.js || true
          grep -q 'fix=reset-excel-filters-v1' dashboard-wip.html

      - name: Commit branch-served assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize Excel filter reset integration'
          git push origin HEAD:fix/wip-reset-excel-filters
