name: WIP branch Pages verification

on:
  push:
    branches: [WIP]
    paths:
      - 'index.html'
      - 'dashboard-wip.html'
      - 'wip-runtime.bundle.js'
      - 'package.json'
      - 'tailwind.config.cjs'
      - '_headers'
      - '*.csv'
      - '*.js'
      - 'assets/**'
      - 'src/**'
      - 'perf-runtime/**'
      - 'scripts/perf-prebuild/**'
      - 'scripts/perf-transforms/**'
      - 'scripts/runtime-source-cleanup.mjs'
      - 'scripts/prune-branch-pages-source.mjs'
      - 'scripts/build-runtime-bundle.mjs'
      - 'scripts/build-pages-optimized.mjs'
      - '.github/workflows/pages-optimized.yml'
      - '.github/workflows/pages-deploy-wip.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages-wip-verify
  cancel-in-progress: true

jobs:
  full-checks-and-live-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Run project checks
        run: npm run check

      - name: Check all WIP and build script syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prepared-data-worker.js
          find . -maxdepth 1 -type f -name 'wip-*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          find perf-runtime -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Validate branch-served source
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-runtime.bundle.js
          grep -q 'wip-city-filter-local-2026-09-07-v5' wip-runtime.bundle.js
          grep -q 'baselineIndex' wip-runtime.bundle.js
          grep -q 'INPUT_DEBOUNCE_MS = 90' wip-runtime.bundle.js
          grep -q '/\* wip-canton-adaptive-filter-patch.js \*/' wip-runtime.bundle.js
          grep -q '__WIP_CANTON_ADAPTIVE_FILTER_PATCH__' wip-runtime.bundle.js
          grep -q 'f-canton-adaptive-select' wip-runtime.bundle.js
          grep -q 'wip-filter-placeholder-cleanup-2026-09-07-v9' wip-runtime.bundle.js
          ! grep -Eq 'id="f-ville"[^>]*oninput="runFilter\(\)"' dashboard-wip.html
          ! grep -q 'f-canton-select' dashboard-wip.html
          ! grep -q 'acc-undercarriage' dashboard-wip.html
          ! grep -q 'patchCantonInProgress' dashboard-wip.html
          ! grep -q 'Menu déroulant canton en cours de développement' dashboard-wip.html
          ! grep -q 'Filtre non fonctionnel' dashboard-wip.html
          ! grep -q 'Filtre à venir' dashboard-wip.html
          grep -q 'wip-runtime.bundle.js?v=20260907-branch-pages-v2&fix=city-local-v5' dashboard-wip.html

      - name: Build unified optimized site
        run: npm run build

      - name: Validate unified artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/dashboard-wip.html
          test -s dist/data11.csv
          test -s dist/csv-data-worker.js
          test -s dist/prepared-data-worker.js
          test -s dist/data/prepared/manifest.json
          test -s dist/assets/manifest.json
          test -n "$(find dist/data/prepared -maxdepth 1 -name 'dept-*.json' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -name 'dashboard.*.min.css' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -name 'dashboard-inline.*.min.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -name 'wip-runtime.*.js' -print -quit)"
          ! test -e dist/wip-runtime.bundle.js
          ! grep -Eq 'id="f-ville"[^>]*oninput="runFilter\(\)"' dist/dashboard-wip.html
          RUNTIME_FILE="$(find dist/assets -maxdepth 1 -name 'wip-runtime.*.js' -print -quit)"
          INLINE_FILE="$(find dist/assets -maxdepth 1 -name 'dashboard-inline.*.min.js' -print -quit)"
          grep -q 'wip-city-filter-local-2026-09-07-v5' "$RUNTIME_FILE"
          grep -q 'baselineIndex' "$RUNTIME_FILE"
          grep -q 'INPUT_DEBOUNCE_MS = 90' "$RUNTIME_FILE"
          grep -q '/\* wip-canton-adaptive-filter-patch.js \*/' "$RUNTIME_FILE"
          grep -q '__WIP_CANTON_ADAPTIVE_FILTER_PATCH__' "$RUNTIME_FILE"
          grep -q 'f-canton-adaptive-select' "$RUNTIME_FILE"
          grep -q 'wip-filter-placeholder-cleanup-2026-09-07-v9' "$RUNTIME_FILE"
          ! grep -q 'f-canton-select' "$INLINE_FILE"
          ! grep -q 'acc-undercarriage' "$INLINE_FILE"
          ! grep -q 'Menu déroulant canton en cours de développement' "$INLINE_FILE"
          node --check "$RUNTIME_FILE"
          node --check "$INLINE_FILE"

      - name: Wait for GitHub branch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20")"
            branch_run="$(jq -c '[.workflow_runs[] | select(.name == "pages build and deployment") | select(.event == "dynamic")] | .[0] // {}' <<<"$payload")"
            status="$(jq -r '.status // "missing"' <<<"$branch_run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$branch_run")"
            echo "branch Pages: status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for GitHub branch Pages deployment.'
          exit 1

      - name: Verify public GitHub Pages branch source
        shell: bash
        run: |
          set -euo pipefail
          base='https://salomeleconte.github.io/Dashbord-Test-V1/'
          query="verify=${GITHUB_SHA}"

          for attempt in $(seq 1 24); do
            html="$(curl -fsSL "${base}dashboard-wip.html?${query}" || true)"
            runtime="$(curl -fsSL "${base}wip-runtime.bundle.js?v=20260907-branch-pages-v2&fix=city-local-v5&${query}" || true)"

            if grep -q 'wip-runtime.bundle.js?v=20260907-branch-pages-v2&fix=city-local-v5' <<<"$html" \
              && grep -q 'wip-city-filter-local-2026-09-07-v5' <<<"$runtime" \
              && grep -q 'baselineIndex' <<<"$runtime" \
              && grep -q '/\* wip-canton-adaptive-filter-patch.js \*/' <<<"$runtime" \
              && grep -q '__WIP_CANTON_ADAPTIVE_FILTER_PATCH__' <<<"$runtime" \
              && grep -q 'f-canton-adaptive-select' <<<"$runtime" \
              && grep -q 'wip-filter-placeholder-cleanup-2026-09-07-v9' <<<"$runtime" \
              && ! grep -Eq 'id="f-ville"[^>]*oninput="runFilter\(\)"' <<<"$html" \
              && ! grep -q 'f-canton-select' <<<"$html" \
              && ! grep -q 'acc-undercarriage' <<<"$html" \
              && ! grep -q 'patchCantonInProgress' <<<"$html" \
              && ! grep -q 'Menu déroulant canton en cours de développement' <<<"$html"; then
              echo 'Public GitHub Pages serves local city filtering, adaptive canton and flat undercarriage WIP.'
              exit 0
            fi

            echo "Public site not updated yet (attempt $attempt/24); retrying..."
            sleep 5
          done

          echo 'Public GitHub Pages is not serving the corrected WIP branch source.'
          exit 1
