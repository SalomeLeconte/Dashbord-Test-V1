name: Temporary materialize city local v5

on:
  push:
    branches: [perf/wip-city-local-filter-20260907]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: perf/wip-city-local-filter-20260907

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize branch Pages source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate runtime bundle
        run: npm run bundle

      - name: Validate local city filtering
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-city-filter-input-fix-patch.js
          node --check wip-runtime.bundle.js
          grep -q 'wip-city-filter-local-2026-09-07-v5' wip-runtime.bundle.js
          grep -q 'baselineIndex' wip-runtime.bundle.js
          grep -q 'INPUT_DEBOUNCE_MS = 90' wip-runtime.bundle.js
          ! grep -Eq 'id="f-ville"[^>]*oninput="runFilter\(\)"' dashboard-wip.html
          grep -q 'fix=city-local-v5' dashboard-wip.html

      - name: Commit branch-served assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize local city filtering for GitHub Pages'
          git push origin HEAD:perf/wip-city-local-filter-20260907
