name: Temporary materialize route panel v2

on:
  push:
    branches: [fix/wip-route-panel-map-height-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/wip-route-panel-map-height-v2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize branch Pages source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate runtime bundle
        run: npm run bundle

      - name: Validate route panel v2
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-route-panel-scroll-patch.js
          node --check wip-runtime.bundle.js
          grep -q 'wip-route-panel-scroll-2026-09-07-v2' wip-runtime.bundle.js
          grep -q '#route-status{display:none!important}' wip-runtime.bundle.js
          grep -q 'scroll-padding-bottom:1.75rem' wip-runtime.bundle.js
          grep -q 'mapRect.bottom - panelRect.top - bottomGap' wip-runtime.bundle.js
          grep -q 'fix=city-local-v5-route-scroll-v2' dashboard-wip.html

      - name: Commit branch-served assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize route status removal and map-bounded panel'
          git push origin HEAD:fix/wip-route-panel-map-height-v2
