name: Temporary materialize compact Data and Top 200 tables

on:
  push:
    branches: [fix/wip-reset-excel-filters]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/wip-reset-excel-filters

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize branch Pages source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate runtime bundle
        run: npm run bundle

      - name: Validate compact table layout
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-data-financial-2026-patch.js
          node --check wip-table-compact-layout-patch.js
          node --check wip-runtime.bundle.js
          grep -q 'wip-data-financial-2026-2026-09-11-v2' wip-runtime.bundle.js
          grep -q 'CA Global 2025' wip-runtime.bundle.js
          grep -q 'wip-table-compact-layout-2026-09-11-v1' wip-runtime.bundle.js
          grep -q 'wip-col-top-machines' wip-runtime.bundle.js
          grep -q 'wip-col-top-visits' wip-runtime.bundle.js
          grep -q 'wip-col-top-todo' wip-runtime.bundle.js
          grep -q 'wip-col-top-contact' wip-runtime.bundle.js
          grep -q 'wip-compact-badges' wip-runtime.bundle.js
          grep -q 'wip-clamp-4' wip-runtime.bundle.js
          grep -q 'fix=reset-excel-filters-v1-financial-2026-v2-compact-tables-v1' dashboard-wip.html

      - name: Commit branch-served assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize compact Data and Top 200 layout'
          git push origin HEAD:fix/wip-reset-excel-filters
