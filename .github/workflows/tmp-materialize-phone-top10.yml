name: Temporary materialize phone and Top 10 fix

on:
  push:
    branches: [fix/wip-phone-details-top10-20260907]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/wip-phone-details-top10-20260907

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize branch Pages source
        run: node scripts/prune-branch-pages-source.mjs

      - name: Regenerate runtime bundle
        run: npm run bundle

      - name: Validate phone and Top 10 fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check wip-stack-guard-patch.js
          node --check wip-runtime.bundle.js
          grep -q 'wip-stack-guard-2026-09-03-v5' wip-runtime.bundle.js
          grep -q '__wipFinalTopLimit' wip-runtime.bundle.js
          grep -q 'contactRichness' wip-runtime.bundle.js
          grep -q "data22.Téléphone" wip-runtime.bundle.js
          grep -q 'rows.slice(0, safeLimit)' wip-runtime.bundle.js
          grep -q 'wip-runtime.bundle.js?v=20260907-branch-pages-v2&fix=phone-top10-v1' dashboard-wip.html

      - name: Commit materialized source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-wip.html wip-runtime.bundle.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize phone details and Top 10 fixes'
          git push origin HEAD:fix/wip-phone-details-top10-20260907
